version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cocstudy_db
    environment:
      POSTGRES_USER: cocstudy
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cocstudy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro  # optional seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocstudy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cocstudy_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cocstudy_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://cocstudy:password@db:5432/cocstudy_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Adminer for DB management
  adminer:
    image: adminer
    container_name: cocstudy_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: